name: Build and Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: 'Deploy Firestore Rules alongside Hosting?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Firebase App Configuration
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: node scripts/verify-firebase-config.js

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Build (npm run build)
        run: npm run build

      - name: Deploy to Firebase Hosting & Firestore Rules
        id: deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0898030963 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: gen-lang-client-0898030963
        run: |
          echo "Preparing Firebase deployment..."
          npm install -g firebase-tools

          DEPLOY_TARGET="hosting"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_rules }}" = "true" ]; then
              DEPLOY_TARGET="hosting,firestore:rules"
            fi
          else
            DEPLOY_TARGET="hosting,firestore:rules"
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Authenticating with Google Cloud Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            firebase deploy --only "$DEPLOY_TARGET" --project "$PROJECT_ID" --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authenticating with FIREBASE_TOKEN..."
            firebase deploy --only "$DEPLOY_TARGET" --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Notice: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret found."
            echo "Build succeeded. To enable automatic live deployments, add FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT to GitHub Secrets."
          fi

      - name: Generate Deployment Artifacts with URLs
        env:
          PROJECT_ID: gen-lang-client-0898030963
          DATABASE_ID: ai-studio-nestwellsocietya-3362f689-fc24-4131-9685-c6aa5e473e20
        run: node scripts/generate-deployment-artifacts.js

      - name: Upload Deployment URLs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-urls
          path: artifacts/
          retention-days: 30
